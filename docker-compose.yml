services:
  dataproof:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATAPROOF_DB_PATH: /data/dataproof.db
    volumes:
      - dataproof-data:/data
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  dataproof-data:
